name: GitHub Pages

# Baut den statischen Export und veroeffentlicht ihn.
# Die Seite erscheint unter https://<benutzer>.github.io/<repository>/
on:
  push:
    branches: [main]
  # Erlaubt einen Start von Hand im Actions-Tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Deploys nicht abbrechen, aber auch nicht doppelt starten
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - uses: actions/configure-pages@v6

      - name: Statischen Export bauen
        # Der Basispfad ergibt sich aus dem Repository-Namen, damit ein
        # Umbenennen nichts kaputt macht.
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Jekyll abschalten
        # Sonst ignorieren manche Pages-Pfade Ordner, die mit _ beginnen
        # — und genau dort liegt _next.
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
